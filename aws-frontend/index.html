<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Customer Registration</h1>

    <p class="description">
        Please complete the form below to register as a customer.
    </p>

    <form id="customerForm">

        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                required
            >
        </div>

        <div class="form-group">
            <label for="dateOfBirth">Date of Birth:</label>
            <input
                type="date"
                id="dateOfBirth"
                name="dateOfBirth"
                required
            >
        </div>

        <div class="form-group">
            <label for="gender">Gender:</label>

            <select id="gender" name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Male">
                    Male
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="address">
                Address:
            </label>

            <textarea
                id="address"
                name="address"
                rows="4"
                required
            ></textarea>

        </div>

        <button type="submit">
            Register Customer
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>

</html>
